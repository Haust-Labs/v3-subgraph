version: '3'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'

  ipfs:
    image: ipfs/go-ipfs:v0.8.0
    ports:
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfsdata:/data/ipfs

  graph-node:
    image: graphprotocol/graph-node
    ports:
      - '8000:8000'
      - '8020:8020'
      - '8030:8030'
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: postgres
      postgres_db: graph-node
      ethereum: 'haust-mainnet:https://rpc.haust.network/'
      ipfs: 'http://ipfs:5001'
    depends_on:
      - postgres
    links:
      - postgres
volumes:
  pgdata:
  ipfsdata:
